name: Build and deploy Node.js app to Azure Web App - quiz

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read # Required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '18.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install
        working-directory: ./quizapp  # Ensure this matches your app directory

      - name: Build the app
        run: npm run build --if-present
        working-directory: ./quizapp

      - name: Run tests
        run: npm run test --if-present
        working-directory: ./quizapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./quizapp  # Only upload the necessary app files

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    permissions:
      id-token: write  # Required for requesting the JWT
      contents: read  # Required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./quizapp  # Extract files into the correct directory

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_4ACAC53FF5594E899BA82B0724E15350 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B7A253562661423DBD88E7C1F7C58C8A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_78E1CF3988F34F56A2489EC09DB6049B }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'quiz'
          slot-name: 'Production'
          package: ./quizapp  # Deploy only the app folder
